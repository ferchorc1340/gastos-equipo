<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gastos del Equipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-header">
    <div>
      <div class="app-title">Gastos del Equipo</div>
      <div class="app-week" id="hdr-week">cargando...</div>
    </div>
    <div class="header-right">
      <div class="header-total" id="hdr-total">$0.00</div>
      <div class="header-total-label">esta semana</div>
    </div>
  </div>

  <!-- VIEW: AGREGAR -->
  <div id="view-add" class="view active">
    <div class="form-section">
      <h3>¿Quién compró?</h3>
      <div class="member-picker">
        <button class="member-btn" data-name="Cami" onclick="selectMember(this)">
          <div class="mb-avatar" style="background:#D4A5C9;color:#7A3B6E">CA</div>Cami
        </button>
        <button class="member-btn" data-name="Ale" onclick="selectMember(this)">
          <div class="mb-avatar" style="background:#A5C9D4;color:#1E5F6E">AL</div>Ale
        </button>
        <button class="member-btn" data-name="Kathy" onclick="selectMember(this)">
          <div class="mb-avatar" style="background:#C9D4A5;color:#4A5E1E">KA</div>Kathy
        </button>
        <button class="member-btn" data-name="Fernando" onclick="selectMember(this)">
          <div class="mb-avatar" style="background:#D4BCA5;color:#6E4A1E">FE</div>Fernando
        </button>
      </div>
    </div>

    <div class="form-section">
      <h3>Detalle de la compra</h3>
      <div class="form-field">
        <label>Descripción</label>
        <input type="text" id="f-desc" placeholder="Ej: compras de la semana, almuerzo..." />
      </div>
      <div class="field-row">
        <div class="form-field">
          <label>Monto ($)</label>
          <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="form-field">
          <label>Comercio</label>
          <div class="comercio-wrap">
            <input type="text" id="f-comercio" placeholder="Súper Las Segovias..." />
            <span class="ai-badge" id="ai-badge">IA</span>
          </div>
          <div class="ai-reading" id="ai-reading">
            <i class="ti ti-sparkles" style="animation:spin 0.8s linear infinite"></i>
            <span>Leyendo factura...</span>
          </div>
        </div>
      </div>
      <div class="form-field">
        <label>Factura (opcional — el comercio se lee automáticamente)</label>
        <div class="upload-zone">
          <input type="file" accept="image/*" id="f-receipt" onchange="handleFile(this)" />
          <i class="ti ti-camera-plus"></i>
          <p>Toca para subir foto de factura</p>
        </div>
        <div class="receipt-preview" id="rp" style="display:none">
          <img id="rp-img" src="" alt="Factura" />
        </div>
      </div>
    </div>

    <button class="save-btn" id="save-btn" onclick="savePurchase()">Guardar compra</button>
  </div>

  <!-- VIEW: COMPRAS -->
  <div id="view-list" class="view">
    <div class="week-nav">
      <button class="wn-btn" onclick="weekShift(-1)">‹</button>
      <span class="wn-label" id="wn-label">Esta semana</span>
      <button class="wn-btn" onclick="weekShift(1)">›</button>
    </div>
    <div class="metrics-row">
      <div class="metric-pill"><div class="mp-val" id="mt-total">$0</div><div class="mp-label">Total</div></div>
      <div class="metric-pill"><div class="mp-val" id="mt-count">0</div><div class="mp-label">Compras</div></div>
      <div class="metric-pill"><div class="mp-val" id="mt-avg">$0</div><div class="mp-label">Promedio</div></div>
    </div>
    <p class="section-label">Compras registradas</p>
    <div id="purchases-list"></div>
  </div>

  <!-- VIEW: BALANCE -->
  <div id="view-balance" class="view">
    <p class="section-label" style="margin-bottom:12px">Semana actual</p>
    <div id="person-bars"></div>
    <div id="settle-section" style="margin-top:20px"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-add" onclick="showView('add')">
      <i class="ti ti-plus"></i>Agregar
    </button>
    <button class="nav-btn" id="nav-list" onclick="showView('list')">
      <i class="ti ti-list"></i>Compras
    </button>
    <button class="nav-btn" id="nav-balance" onclick="showView('balance')">
      <i class="ti ti-scale"></i>Balance
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal-bg" id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="modal-img" src="" alt="Factura" />
      <button class="modal-close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
